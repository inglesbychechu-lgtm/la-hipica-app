<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>La Hípica · Comandas</title><meta name="color-scheme" content="dark"><meta name="theme-color" content="#14110f"><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.json"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#14110f;--fg:#f3ede4;--card:#201b17;--mut:#a79d90;--ac:#c8a26a;--free:#6bbf8a;--occ:#d9645a;--pay:#e3a14a;--res:#6f9bd6;--bd:#352e28;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{overflow-x:hidden}h2,h3,.ordh,.sech{font-family:'Crimson Text',Georgia,serif}h2{font-size:24px;letter-spacing:1px}h3{margin:18px 0 8px;font-size:21px}.brand{color:var(--ac);letter-spacing:3px;margin:6px 0}.brand small{display:block;font-size:12px;letter-spacing:5px;color:var(--mut);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:400}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:16px 'Plus Jakarta Sans',system-ui,sans-serif;padding-bottom:70px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;padding:14px 2px;border:0;background:none;color:var(--mut);font-size:13px}nav button.on{color:var(--ac);font-weight:700}
main{padding:12px;max-width:1100px;margin:auto}h2{margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}.t{background:var(--card);border-radius:20px;padding:14px 6px;min-height:112px;cursor:pointer;text-align:center;border:2px solid transparent}.t svg{color:var(--c)}.t b{font-size:22px;display:block}.t small{display:block;color:var(--mut);font-size:12px;margin-top:2px}.t.sel{border-color:var(--ac)}
.libre{--c:var(--free)}.ocupada{--c:var(--occ)}.cobro{--c:var(--pay)}.reservada{--c:var(--res)}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cnt{background:var(--card);border-radius:18px;padding:16px 6px;text-align:center;color:var(--mut)}.cnt b{display:block;font-size:36px}.hd{display:flex;justify-content:space-between;align-items:center}.pill{background:#14532d;color:#4ade80;border-radius:20px;padding:6px 12px;font-size:14px}.qa{background:none;border:1px solid var(--bd);border-radius:18px;padding:18px 8px;color:var(--fg);font-size:16px;font-weight:600}
button.b{background:var(--ac);color:#1b1510;font-weight:600;border:0;border-radius:12px;padding:12px 14px;font-size:15px}button.g{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin:10px 0}
.split{display:grid;gap:12px}@media(min-width:800px){.split{grid-template-columns:1.2fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chips .on{background:var(--ac);color:#1b1510;border-color:var(--ac)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:10px}.p{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px 6px;color:var(--fg);min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}.p .em{font-size:38px;line-height:1.1}.p b{font-size:14px}.p .pr{color:var(--ac);font-weight:700}.p.off{opacity:.4}.sech{display:flex;align-items:center;gap:8px;background:var(--ac);color:#1b1510;border-radius:14px;padding:10px 14px;margin:14px 0 10px;font-weight:700}.pi{width:100%;height:62px;object-fit:cover;border-radius:12px;margin-bottom:2px}.ban{width:100%;height:120px;object-fit:cover;border-radius:16px;margin:0 0 10px;display:block}.card.ord{border:2px solid var(--ac)}.ordh{border-bottom:2px solid var(--ac);padding-bottom:8px;margin-bottom:6px;font-weight:700;font-size:17px}.cat{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;padding:8px 6px}.cat span{font-size:26px}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.row>div{flex:1;min-width:0}.row input{width:100%;margin-top:4px}
input,select{padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:15px;max-width:100%}
.mut{color:var(--mut);font-size:13px}.bar{height:14px;background:var(--ac);border-radius:4px}
</style></head><body><main id="app"></main>
<nav><button data-t="mesas">Mesas</button><button data-t="cobros">Cobros</button><button data-t="carta">Carta</button><button data-t="stats">Ventas</button><button data-t="hist">Historial</button></nav>
<script src="config.js"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>(Math.round(n*100)/100).toFixed(2).replace('.',',')+' €';
const S={cfg:{},undo:[],tables:[],products:[],orders:{},sales:[],tab:'mesas',sel:null,cat:'Favoritos',ready:false,err:''};
let db=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const total=o=>(o?.items||[]).filter(i=>i.st!=='cancelado').reduce((a,i)=>a+i.price*i.qty,0);
const paid=o=>(o?.pays||[]).reduce((a,p)=>a+p.amt,0);
const ago=t=>{const m=Math.floor((Date.now()-t)/60000);return m<60?m+' min':Math.floor(m/60)+' h '+m%60+' min'};
const safe=async f=>{try{await f()}catch(e){S.err='Error al guardar: '+(e.message||e.code||e);render()}};
const saveOrder=(tid,o)=>safe(()=>db.doc('orders/'+tid).set(o));

function loadScript(u){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
function localDb(){const K='hipica_db';let D={};const sub={};
 const load=()=>{try{D=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){D={}}},save=()=>localStorage.setItem(K,JSON.stringify(D));load();
 const snap=c=>({docs:Object.entries(D[c]||{}).map(([id,v])=>({id,data:()=>structuredClone(v)}))}),notify=c=>(sub[c]||[]).forEach(f=>f(snap(c)));
 addEventListener('storage',e=>{if(e.key===K){load();Object.keys(sub).forEach(notify)}});
 return{collection:c=>({onSnapshot:f=>{(sub[c]=sub[c]||[]).push(f);setTimeout(()=>f(snap(c)),0);return()=>{}}}),
  doc:p=>{const i=p.indexOf('/'),c=p.slice(0,i),id=p.slice(i+1);return{
   set:async d=>{(D[c]=D[c]||{})[id]=structuredClone(d);save();notify(c)},
   update:async d=>{const x=(D[c]||{})[id];if(!x)throw new Error('El documento no existe');Object.assign(x,d);save();notify(c)},
   delete:async()=>{if(D[c])delete D[c][id];save();notify(c)}}}}}
async function getDb(){const c=window.FIREBASE_CONFIG;if(!c)return localDb();
 const B='https://www.gstatic.com/firebasejs/10.12.2/';await loadScript(B+'firebase-app-compat.js');await loadScript(B+'firebase-firestore-compat.js');
 firebase.initializeApp(c);return firebase.firestore()}
async function init(){
 try{db=await getDb()}catch(e){console.error(e)}
 if(!db){document.getElementById('app').innerHTML='<div class="card">Inicia sesión para usar la base de datos compartida.</div>';return}
 const sub=(c,k,fn)=>db.collection(c).onSnapshot(s=>{S[k]=fn(s);S.ready=true;render()},e=>{S.err='Sin conexión: '+(e.message||e.code);render()});
 const arr=s=>s.docs.map(d=>({id:d.id,...d.data()}));
 sub('tables','tables',s=>arr(s).sort((a,b)=>a.name.localeCompare(b.name,'es',{numeric:true})));
 sub('products','products',s=>arr(s).sort((a,b)=>(a.ord||0)-(b.ord||0)));
 sub('orders','orders',s=>Object.fromEntries(arr(s).map(o=>[o.id,o])));
 sub('sales','sales',s=>arr(s).sort((a,b)=>b.ts-a.ts));
 sub('settings','cfg',s=>arr(s).find(x=>x.id==='cfg')||{});
}
async function seed(){await safe(async()=>{
 await mkSections();
 const P=[['Entrantes','Croquetas',9],['Entrantes','Patatas bravas',6.5],['Ensaladas','Ensalada mixta',8],['Carnes','Entrecot',19],['Pescados','Merluza',17],['Hamburguesas','Hamburguesa clásica',12],['Postres','Tarta de queso',5.5],['Refrescos','Cola',2.8],['Cervezas','Caña',2.5],['Vinos','Copa de tinto',3.5],['Cafés','Café solo',1.6]];
 for(const [i,p] of P.entries())await db.doc('products/p'+i).set({cat:p[0],name:p[1],price:p[2],on:true,out:false,ord:i,fav:i%3==0,sold:0});
})}
function status(t){const o=S.orders[t.id];return o?(o.bill?'cobro':'ocupada'):(t.reserved?'reservada':'libre')}
const LBL={libre:'Libre',ocupada:'Ocupada',cobro:'Pendiente de cobro',reservada:'Reservada'};
function render(){
 document.querySelectorAll('nav button').forEach(b=>{b.className=b.dataset.t===S.tab?'on':'';b.onclick=()=>{S.tab=b.dataset.t;S.sel=null;render()}});
 if(S.ready&&!S.cd&&!S.products.some(p=>String(p.id).startsWith('h'))&&S.products.some(p=>/^p\d+$/.test(p.id)&&!DRINK.includes(p.cat))){S.cd=1;safe(loadCarta)}
 if(S.ready&&!S.cb&&S.products.some(p=>String(p.id).startsWith('h'))&&!S.products.some(p=>String(p.id).startsWith('b'))){S.cb=1;safe(loadBebidas)}
 const a=document.getElementById('app');let h=S.err?`<div class="card" style="background:var(--pay)">${esc(S.err)} <button class="g" onclick="S.err='';render()">OK</button></div>`:'';
 if(S.undo.length)h+=`<div class="card" style="display:flex;align-items:center;gap:10px"><span class="mut" style="flex:1">Última acción: ${esc(S.undo[S.undo.length-1].label)}</span><button class="b" onclick="undo()">↩ Deshacer</button></div>`;
 if(S.ready&&!S.tables.length&&!S.products.length)h+=`<div class="card">La base de datos está vacía. <button class="b" onclick="seed()">Cargar datos de demostración</button></div>`;
 h+=({mesas:vMesas,cobros:vCobros,carta:vCarta,stats:vStats,hist:vHist})[S.tab]();a.innerHTML=h;
}
const vis=t=>!t.mergedInto||!S.tables.some(x=>x.id===t.mergedInto);
function pushU(label,fn){S.undo.push({label,fn});if(S.undo.length>20)S.undo.shift()}
async function undo(){const u=S.undo.pop();if(u)await safe(u.fn);render()}

async function mut(id,fn){const o=structuredClone(S.orders[id]);if(!o)return;fn(o);await saveOrder(id,o)}
function openT(id){const g=+document.getElementById('gu').value||1;saveOrder(id,{items:[],guests:g,opened:Date.now(),pays:[],bill:false})}
function add(pid){const p=S.products.find(x=>x.id===pid),id=S.sel;const o=S.orders[id]||{items:[],guests:1,opened:Date.now(),pays:[],bill:false};const n=structuredClone(o);
 const ex=n.items.find(i=>i.pid===pid&&i.st==='pendiente'&&!i.note);if(ex)ex.qty++;else n.items.push({id:uid(),pid,name:p.name,price:p.price,qty:1,st:'pendiente',note:''});saveOrder(id,n)}
const it=(iid,f)=>mut(S.sel,o=>{const i=o.items.find(x=>x.id===iid);if(i)f(i,o)});
function qty(iid,d){it(iid,(i,o)=>{if(i.st!=='pendiente'&&d<0){i.st='cancelado';return}i.qty+=d;if(i.qty<1)o.items=o.items.filter(x=>x!==i&&x.id!==iid)})}
function note(iid,v){it(iid,i=>i.note=v)}function gnote(id,v){mut(id,o=>o.note=v)}
const FLOW=['enviado','en preparación','preparado','entregado'];
function cyc(iid){it(iid,i=>{if(i.st==='pendiente'||i.st==='cancelado')return;i.st=FLOW[(FLOW.indexOf(i.st)+1)%FLOW.length]})}
function send(id){mut(id,o=>o.items.forEach(i=>{if(i.st==='pendiente')i.st='enviado'}))}
function bill(id){mut(id,o=>o.bill=!o.bill)}

 pushU('Eliminar mesa '+t.name,async()=>{await db.doc('tables/'+id).set(d);for(const k of kids)await db.doc('tables/'+k).update({mergedInto:id})});

 <div class="grid"><div class="card"><div class="mut">Facturado</div><b style="font-size:22px">${eur(sum)}</b></div><div class="card"><div class="mut">Mesas atendidas</div><b style="font-size:22px">${L.length}</b></div><div class="card"><div class="mut">Ticket medio</div><b style="font-size:22px">${eur(L.length?sum/L.length:0)}</b></div><div class="card" style="background:var(--occ)"><div class="mut">Pendiente de cobro</div><b style="font-size:22px">${eur(pend)}</b></div></div>
 <div class="card"><b>Por día</b>${bars(dd,eur)}</div><div class="card"><b>Productos más vendidos</b>${bars(prod)}</div><div class="card"><b>Métodos de pago</b>${bars(pm,eur)}</div><div class="card"><b>Horas de mayor actividad</b>${bars(hr)}</div>`}
function cancelT(id){const o=S.orders[id];if(!o)return;const {id:_i,...d}=o;pushU('Cerrar mesa',()=>db.doc('orders/'+id).set(d));safe(()=>db.doc('orders/'+id).delete()).then(()=>{S.sel=null;render()})}
function delSale(id){const s=S.sales.find(x=>x.id===id);if(!s)return;const {id:_i,...d}=s;pushU('Eliminar registro',()=>db.doc('sales/'+id).set(d));safe(()=>db.doc('sales/'+id).delete())}
function delShown(){const d=S.hd||'',m=S.hm||'',L=S.sales.filter(s=>(!d||day(s.ts)===d)&&(!m||s.table===m)),bk=L.map(({id,...x})=>[id,x]);S.cfm=0;pushU('Eliminar '+L.length+' registros',async()=>{for(const [i,x] of bk)await db.doc('sales/'+i).set(x)});safe(async()=>{for(const [i] of bk)await db.doc('sales/'+i).delete()})}
function endDay(){const prev=S.cfg.closedAt||0;pushU('Finalizar día',()=>db.doc('settings/cfg').set({closedAt:prev}));safe(()=>db.doc('settings/cfg').set({closedAt:Date.now()}))}
function vCobros(){
 const cut=S.cfg.closedAt||0,L=S.sales.filter(s=>day(s.ts)===day(Date.now())&&s.ts>cut),sum=L.reduce((a,s)=>a+s.total,0),pm={};
 L.forEach(s=>s.pays.forEach(p=>pm[p.m]=(pm[p.m]||0)+p.amt));
 const open=Object.entries(S.orders).map(([id,o])=>[id,o,S.tables.find(t=>t.id===id)]).filter(x=>x[2]);
 return `<h2>Cobros</h2><h3>Cuentas abiertas</h3>${open.map(([id,o,t])=>`<div class="card" style="cursor:pointer" onclick="S.tab='mesas';S.sel='${id}';render()"><b>${esc(lbl(t))}</b> · ${eur(total(o)-paid(o))} pendiente</div>`).join('')||'<p class="mut">No hay cuentas abiertas</p>'}
 <h3>Cobrado hoy</h3><div class="grid3"><div class="cnt"><b style="color:var(--free);font-size:22px">${eur(sum)}</b>Total</div><div class="cnt"><b>${L.length}</b>Mesas</div><div class="cnt"><b style="font-size:15px">${Object.entries(pm).map(([k,v])=>k+' '+eur(v)).join('<br>')||'-'}</b>Métodos</div></div>
 ${L.map(s=>`<div class="card"><b>Mesa ${esc(s.table)}</b> · ${new Date(s.ts).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})} · <b>${eur(s.total)}</b><div class="mut">${s.pays.map(p=>p.m+' '+eur(p.amt)).join(' · ')}</div></div>`).join('')}
 <p><button class="b" onclick="endDay()">Finalizar día</button></p><p class="mut">Al finalizar el día se vacía esta lista. Los registros siguen en el Historial.</p>`}
function vHist(){
 const d=S.hd||'',m=S.hm||'';const L=S.sales.filter(s=>(!d||day(s.ts)===d)&&(!m||s.table===m));
 return `<h2>Historial</h2><div class="card">Fecha <input type="date" value="${d}" onchange="S.hd=this.value;render()"> Mesa <select onchange="S.hm=this.value;render()"><option value="">Todas</option>${S.tables.filter(vis).map(t=>`<option ${lbl(t)===m?'selected':''}>${esc(lbl(t))}</option>`).join('')}</select> ${L.length?(S.cfm?`<button class="b" onclick="delShown()">Confirmar: eliminar ${L.length}</button> <button class="g" onclick="S.cfm=0;render()">Cancelar</button>`:`<button class="g" onclick="S.cfm=1;render()">Eliminar los ${L.length} mostrados</button>`):''}</div>
 ${L.map(s=>`<div class="card"><b>Mesa ${esc(s.table)}</b> · ${new Date(s.ts).toLocaleString('es-ES')} · <b>${eur(s.total)}</b><div class="mut">${s.items.map(i=>i.qty+'× '+esc(i.name)).join(', ')}</div><div class="mut">${s.pays.map(p=>p.m+' '+eur(p.amt)).join(' · ')} · Cerrada</div><button class="g" style="margin-top:8px" onclick="delSale('${s.id}')">Eliminar registro</button></div>`).join('')||'<p class="mut">Sin servicios</p>'}`}
setInterval(()=>{if(S.tab==='mesas'&&!document.activeElement?.matches('input,select'))render()},30000);
render();init();
</script></body></html>
